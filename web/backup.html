<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Backup</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 40px;
      }

      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 24px;
        max-width: 500px;
      }

      button {
        padding: 12px 18px;
        font-size: 16px;
        cursor: pointer;
      }

      .status {
        margin-top: 16px;
        font-weight: 600;
      }

      .ok { color: #0a7a0a; }
      .err { color: #b00020; }
      .hint { color: #444; }

      pre {
        margin-top: 16px;
        background: #0b0f14;
        color: #d6deeb;
        padding: 12px;
        border-radius: 6px;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Database Backup</h2>

      <button id="btnBackup">Run Backup</button>

      <div id="status" class="status hint">Ready.</div>
      <pre id="output">{}</pre>
    </div>

    <script>
      const btn = document.getElementById("btnBackup");
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");

      function setStatus(message, type = "hint") {
        statusEl.className = "status " + type;
        statusEl.textContent = message;
      }

      async function readJsonResponse(res) {
        const text = await res.text();
        if (!text) return {};
        try { return JSON.parse(text); }
        catch { return { _raw: text }; }
      }

      async function runBackup() {
        setStatus("Running backup...");

        try {
          const res = await fetch("/api/backup/backup", {
            method: "POST"
          });

          const data = await readJsonResponse(res);

          if (!res.ok) {
            setStatus(`Backup failed (${res.status})`, "err");
            outputEl.textContent = JSON.stringify(data, null, 2);
            return;
          }

          setStatus("Backup completed successfully.", "ok");
          outputEl.textContent = JSON.stringify(data, null, 2);

        } catch (err) {
          setStatus("Network error.", "err");
          outputEl.textContent = err.toString();
        }
      }

      btn.onclick = () => runBackup();
    </script>
  </body>
</html>
