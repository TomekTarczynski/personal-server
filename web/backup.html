<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Backup</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 40px;
      }

      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 24px;
        max-width: 760px;
      }

      .btns {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      button {
        padding: 12px 18px;
        font-size: 16px;
        cursor: pointer;
      }

      .status {
        margin-top: 16px;
        font-weight: 600;
      }

      .ok { color: #0a7a0a; }
      .err { color: #b00020; }
      .hint { color: #444; }

      pre {
        margin-top: 16px;
        background: #0b0f14;
        color: #d6deeb;
        padding: 12px;
        border-radius: 6px;
        overflow: auto;
      }

      .section {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid #eee;
      }

      .list {
        margin: 10px 0 0 0;
        padding: 0;
        list-style: none;
      }

      .item {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border: 1px solid #eee;
        border-radius: 8px;
        margin-bottom: 10px;
      }

      .meta {
        min-width: 0;
      }

      .name {
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 520px;
      }

      .path {
        font-size: 13px;
        color: #555;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 520px;
      }

      .smallbtn {
        padding: 10px 14px;
        font-size: 14px;
      }

      .item .btns {
        gap: 8px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Database Backup</h2>

      <div class="btns">
        <button id="btnBackup">Run Backup</button>
        <button id="btnList">List Backups</button>
      </div>

      <div id="status" class="status hint">Ready.</div>

      <div class="section">
        <h3 style="margin: 0 0 8px 0;">Backups</h3>
        <ul id="backupList" class="list"></ul>
      </div>

      <pre id="output">{}</pre>
    </div>

    <script>
      const btnBackup = document.getElementById("btnBackup");
      const btnList = document.getElementById("btnList");
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");
      const backupListEl = document.getElementById("backupList");

      function setStatus(message, type = "hint") {
        statusEl.className = "status " + type;
        statusEl.textContent = message;
      }

      async function readJsonResponse(res) {
        const text = await res.text();
        if (!text) return {};
        try { return JSON.parse(text); }
        catch { return { _raw: text }; }
      }

      function basename(p) {
        if (!p) return "file";
        const s = String(p);
        const idx = s.lastIndexOf("/");
        return idx >= 0 ? s.slice(idx + 1) : s;
      }

      function pickPath(entry) {
        // Dropbox list usually provides: name, path_display, path_lower
        return entry?.path_display || entry?.path_lower || entry?.path || entry?.id || "";
      }

      function clearList() {
        backupListEl.innerHTML = "";
      }

      function renderList(entries) {
        clearList();

        if (!entries || entries.length === 0) {
          const li = document.createElement("li");
          li.className = "item";
          li.textContent = "No backups found.";
          backupListEl.appendChild(li);
          return;
        }

        for (const entry of entries) {
          const path = pickPath(entry);
          const name = entry?.name || basename(path);

          const li = document.createElement("li");
          li.className = "item";

          const meta = document.createElement("div");
          meta.className = "meta";

          const nameEl = document.createElement("div");
          nameEl.className = "name";
          nameEl.title = name;
          nameEl.textContent = name;

          const pathEl = document.createElement("div");
          pathEl.className = "path";
          pathEl.title = path;
          pathEl.textContent = path;

          meta.appendChild(nameEl);
          meta.appendChild(pathEl);

          const actions = document.createElement("div");
          actions.className = "btns";

          const btnDownload = document.createElement("button");
          btnDownload.className = "smallbtn";
          btnDownload.textContent = "Download";
          btnDownload.onclick = () => downloadBackup(path, name);

          const btnRestore = document.createElement("button");
          btnRestore.className = "smallbtn";
          btnRestore.textContent = "Restore";
          btnRestore.onclick = () => downloadAndRestoreBackup(path, name);

          actions.appendChild(btnDownload);
          actions.appendChild(btnRestore);

          li.appendChild(meta);
          li.appendChild(actions);

          backupListEl.appendChild(li);
        }
      }

      async function runBackup() {
        setStatus("Running backup...");

        try {
          const res = await fetch("/api/backup/backup", { method: "POST" });
          const data = await readJsonResponse(res);

          if (!res.ok) {
            setStatus(`Backup failed (${res.status})`, "err");
            outputEl.textContent = JSON.stringify(data, null, 2);
            return;
          }

          setStatus("Backup completed successfully.", "ok");
          outputEl.textContent = JSON.stringify(data, null, 2);

        } catch (err) {
          setStatus("Network error.", "err");
          outputEl.textContent = err.toString();
        }
      }

      async function listBackups() {
        setStatus("Fetching backup list...");

        try {
          const res = await fetch("/api/backup/list");
          const data = await readJsonResponse(res);

          if (!res.ok) {
            setStatus(`List failed (${res.status})`, "err");
            outputEl.textContent = JSON.stringify(data, null, 2);
            clearList();
            return;
          }

          const entries = Array.isArray(data.entries) ? data.entries : [];
          setStatus(`Found ${entries.length} backup file(s).`, "ok");

          // show raw response in the output pane
          outputEl.textContent = JSON.stringify(data, null, 2);

          // render UI list
          renderList(entries);

        } catch (err) {
          setStatus("Network error.", "err");
          outputEl.textContent = err.toString();
          clearList();
        }
      }

      async function downloadBackup(dropboxPath, filename) {
        setStatus(`Downloading ${filename}...`);

        // Request server-side download destination
        const localPath = `/tmp/${filename}`;

        try {
          const res = await fetch("/api/backup/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              dropbox_path: dropboxPath,
              local_path: localPath
            })
          });

          const data = await readJsonResponse(res);

          if (!res.ok) {
            setStatus(`Download failed (${res.status})`, "err");
            outputEl.textContent = JSON.stringify(data, null, 2);
            return;
          }

          setStatus(`Downloaded to ${localPath}`, "ok");
          outputEl.textContent = JSON.stringify(data, null, 2);

        } catch (err) {
          setStatus("Network error.", "err");
          outputEl.textContent = err.toString();
        }
      }

      async function downloadAndRestoreBackup(dropboxPath, filename) {
        const localPath = `/tmp/${filename}`;

        setStatus(`Downloading ${filename}...`);

        try {
          // 1) download
          const resDl = await fetch("/api/backup/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              dropbox_path: dropboxPath,
              local_path: localPath
            })
          });

          const dataDl = await readJsonResponse(resDl);

          if (!resDl.ok) {
            setStatus(`Download failed (${resDl.status})`, "err");
            outputEl.textContent = JSON.stringify(dataDl, null, 2);
            return;
          }

          // 2) restore
          setStatus(`Restoring from ${localPath}...`);

          const resRs = await fetch("/api/backup/restore", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ local_path: localPath })
          });

          const dataRs = await readJsonResponse(resRs);

          if (!resRs.ok) {
            setStatus(`Restore failed (${resRs.status})`, "err");
            outputEl.textContent = JSON.stringify(
              { download: dataDl, restore: dataRs },
              null,
              2
            );
            return;
          }

          setStatus(`Restore completed from ${filename}.`, "ok");
          outputEl.textContent = JSON.stringify(
            { download: dataDl, restore: dataRs },
            null,
            2
          );
        } catch (err) {
          setStatus("Network error.", "err");
          outputEl.textContent = err.toString();
        }
      }      

      btnBackup.onclick = runBackup;
      btnList.onclick = listBackups;

      // Optional: auto-load list on page open
      // listBackups();
    </script>
  </body>
</html>
